name: Bluent v3 Token Contract

on:
  workflow_dispatch:
  pull_request:
    branches:
      - bluent-v3
    paths:
      - ".github/workflows/v3-token-contract.yml"
      - "scripts/quality/generate_v3_token_preview.py"
      - "scripts/quality/generate_v3_scoped_brands.py"
      - "scripts/quality/v3_theme_css_parser.py"
      - "scripts/quality/test_v3_theme_css_parser.py"
      - "scripts/quality/test_v3_focus_alias_contract.py"
      - "scripts/quality/audit_v3_token_preview_contrast.py"
      - "scripts/quality/audit_v3_brand_focus_candidate.py"
      - "scripts/quality/test_v3_brand_focus_candidate.py"
      - "scripts/quality/penpot_v3_field_brand_focus_review_audit.js"
      - "scripts/quality/penpot_v3_brand_hover_host_audit.js"
      - "scripts/quality/audit_v3_focus_host_surface_matrix.py"
      - "scripts/quality/test_v3_focus_host_surface_matrix.py"
      - "scripts/quality/audit_v3_focus_alpha_hosts.py"
      - "scripts/quality/test_v3_focus_alpha_hosts.py"
      - "scripts/quality/probe_v3_focus_alpha_hosts_browser.mjs"
      - "docs/v3/tokens/FOCUS-ALPHA-HOST-AUDIT.md"
      - "scripts/quality/test_v3_approved_focus_host_token_bridge.py"
      - "docs/v3/tokens/FOCUS-HOST-TOKEN-CROSSWALK.md"
      - "docs/v3/tokens/SLIDER-FORCED-COLORS-BROWSER-RESEARCH.md"
      - "docs/v3/tokens/evidence/SLIDER-HC-*"
      - "scripts/quality/test_v3_slider_hc_token_candidate.py"
      - "scripts/quality/probe_v3_slider_hc_token_candidate.mjs"
      - "scripts/quality/test_v3_issue418_additive_api_ledger.py"
      - "docs/v3/tokens/ISSUE418-ADDITIVE-API-CONTRACT-REVIEW.md"
      - "docs/v3/inventory/public-component-contracts.json"
      - "scripts/quality/test_v3_danger_toggle_contrast.py"
      - "src/Bluent.UI/wwwroot/v3/danger-toggle.opt-in.preview.css"
      - "scripts/quality/penpot_v3_danger_toggle_contrast_audit.js"
      - "docs/v3/tokens/DANGER-TOGGLED-READABILITY-REVIEW.md"
      - "docs/v3/tokens/DANGER-TOGGLE-PACKAGED-OPTIN.md"
      - "scripts/quality/penpot_v3_focus_context_hosts_audit.js"
      - "docs/v3/tokens/FOCUS-HOST-CONTEXT-REVIEW.md"
      - "docs/v3/tokens/BRANDED-FOCUS-PENPOT-PAGE07-REVIEW.md"
      - "docs/v3/tokens/BRANDED-FOCUS-HOVER-CANDIDATE.md"
      - "scripts/quality/check_v3_typography_source_contract.py"
      - "scripts/quality/audit_v3_system_font_continuity.py"
      - "scripts/quality/test_v3_system_font_continuity.py"
      - "src/Bluent.UI/Styles/Themes/**"
      - "docs/v3/tokens/issue-418-*"
      - "scripts/quality/sync_v3_token_demo_asset.py"
      - "src/Bluent.UI.Demo.Pages/wwwroot/v3/issue-418.opt-in.preview.css"
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  token-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout v3 task branch
        uses: actions/checkout@v4
      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reject malformed source CSS or drifted preview
        run: |
          python -m unittest discover -s scripts/quality -p 'test_v3_theme_css_parser.py' -v
          python -m unittest discover -s scripts/quality -p 'test_v3_focus_alias_contract.py' -v
          python scripts/quality/generate_v3_token_preview.py --check
          python scripts/quality/sync_v3_token_demo_asset.py --check
          python scripts/quality/generate_v3_scoped_brands.py --check
          python scripts/quality/check_v3_typography_source_contract.py
          python -m unittest discover -s scripts/quality -p 'test_v3_system_font_continuity.py' -v
          python scripts/quality/audit_v3_system_font_continuity.py
          python scripts/quality/audit_v3_token_preview_contrast.py
          python -m unittest discover -s scripts/quality -p 'test_v3_brand_focus_candidate.py' -v
          python scripts/quality/audit_v3_brand_focus_candidate.py
          node --check scripts/quality/penpot_v3_field_brand_focus_review_audit.js
          node --check scripts/quality/penpot_v3_brand_hover_host_audit.js
          python -m unittest discover -s scripts/quality -p 'test_v3_focus_host_surface_matrix.py' -v
          python -m unittest discover -s scripts/quality -p 'test_v3_approved_focus_host_token_bridge.py' -v
          python -m unittest discover -s scripts/quality -p 'test_v3_slider_hc_token_candidate.py' -v
          node --check scripts/quality/probe_v3_slider_hc_token_candidate.mjs
          python -m unittest discover -s scripts/quality -p 'test_v3_issue418_additive_api_ledger.py' -v
          python -m unittest discover -s scripts/quality -p 'test_v3_danger_toggle_contrast.py' -v
          node --check scripts/quality/penpot_v3_danger_toggle_contrast_audit.js
          python scripts/quality/audit_v3_focus_host_surface_matrix.py
          python -m unittest discover -s scripts/quality -p 'test_v3_focus_alpha_hosts.py' -v
          python scripts/quality/audit_v3_focus_alpha_hosts.py > v3-alpha-focus-research.json
          node --check scripts/quality/probe_v3_focus_alpha_hosts_browser.mjs
          node --check scripts/quality/penpot_v3_focus_context_hosts_audit.js
