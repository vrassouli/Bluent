name: Bluent v3 Fluent Parity Source Audit

# This never runs against or publishes stable 2.x Dev.
on:
  pull_request:
    branches: [bluent-v3]
    paths:
      - ".github/workflows/v3-fluent-parity-audit.yml"
      - "src/Bluent.Core/BluentComponentBase.cs"
      - "src/Bluent.UI/Components/**"
      - "docs/v3/quality/FLUENT-PARITY-**"
      - "docs/v3/quality/FLUENT-WC-**"
      - "docs/v3/quality/evidence/**"
      - "scripts/quality/fixtures/**"
      - "scripts/quality/probe_v3_*reference.mjs"
      - "scripts/quality/check_v3_fluent_wc_manifest.py"
      - "scripts/quality/test_v3_fluent_wc_manifest.py"
      - "scripts/quality/test_v3_p0_visual_evidence.py"
      - "scripts/quality/test_v3_p0_normalized_visual.py"
      - "scripts/quality/test_v3_p0_accessibility_modes.py"
      - "scripts/quality/test_v3_p0_ax_keyboard_proposal.py"
      - "scripts/quality/test_v3_p0_fileselect_live_upload.py"
      - "scripts/quality/test_v3_p0_fileselect_published_server.py"
      - "scripts/quality/test_v3_p0_pointer_scroll_evidence.py"
      - "scripts/quality/test_v3_p0_button_keyboard_evidence.py"
      - "scripts/quality/run_v3_fileselect_published_server.ps1"
      - "scripts/quality/audit_v3_parity_*.py"
      - "scripts/quality/test_v3_parity_*.py"
      - "scripts/quality/check_v3_p0_source_evidence.py"
      - "scripts/quality/audit_v3_p0_semantic_gaps.py"
      - "scripts/quality/test_v3_p0_semantic_gaps.py"
      - "scripts/quality/check_v3_parity_clr_crosswalk.py"
      - "scripts/quality/test_v3_parity_clr_crosswalk.py"
      - "docs/v3/inventory/public-component-contracts.json"
      - "scripts/quality/test_v3_p0_source_evidence.py"
      - "scripts/quality/test_v3_icon_variant_source.py"
      - "src/Bluent.UI/Icons/**"
      - "src/Bluent.UI.IconGenerator/FluentIconsGenerator.cs"
      - "src/Bluent.UI/wwwroot/fonts/icons/FluentSystemIcons-Resizable.json"
      - "src/Bluent.UI.Demo.Pages/Pages/Components/Icons.razor"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-evidence-only:
    name: Baseline source census and negative controls
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Guard exact published Fluent Web Components 3.1.3 CEM source
        run: python scripts/quality/check_v3_fluent_wc_manifest.py
      - name: Guard P0 source anchors
        run: python scripts/quality/check_v3_p0_source_evidence.py
      - name: Guard seven source-proven P0 semantic and coordinate findings
        run: python scripts/quality/audit_v3_p0_semantic_gaps.py
      - name: Guard all 18 direct API snapshots
        run: python scripts/quality/audit_v3_parity_source_api.py
      - name: Guard all 18 locally inherited API chains
        run: python scripts/quality/audit_v3_parity_inherited_api.py
      - name: Verify declared API matches #494 compiled CLR contract
        run: python scripts/quality/check_v3_parity_clr_crosswalk.py
      - name: Prove false approval and API drift fail
        run: |
          python -m unittest discover -s scripts/quality -p "test_v3_p0_source_evidence.py" -v
          python -m unittest discover -s scripts/quality -p "test_v3_p0_semantic_gaps.py" -v
          python -m unittest discover -s scripts/quality -p "test_v3_parity_source_api.py" -v
          python -m unittest discover -s scripts/quality -p "test_v3_parity_inherited_api.py" -v
          python -m unittest discover -s scripts/quality -p "test_v3_parity_clr_crosswalk.py" -v
          python -m unittest discover -s scripts/quality -p "test_v3_fluent_wc_manifest.py" -v
          python -m unittest discover -s scripts/quality -p "test_v3_p0_visual_evidence.py" -v
          python -m unittest discover -s scripts/quality -p "test_v3_p0_normalized_visual.py" -v
          python -m unittest discover -s scripts/quality -p "test_v3_p0_accessibility_modes.py" -v
          python -m unittest discover -s scripts/quality -p "test_v3_p0_ax_keyboard_proposal.py" -v
          python -m unittest discover -s scripts/quality -p "test_v3_p0_fileselect_live_upload.py" -v
          python -m unittest discover -s scripts/quality -p "test_v3_p0_fileselect_published_server.py" -v
          python -m unittest discover -s scripts/quality -p "test_v3_p0_pointer_scroll_evidence.py" -v
          python -m unittest discover -s scripts/quality -p "test_v3_p0_button_keyboard_evidence.py" -v
          python -m unittest discover -s scripts/quality -p "test_v3_icon_variant_source.py" -v
      - name: Explicit acceptance disclaimer
        run: echo "PASS means source and stored browser evidence guards only; no live CI browser, no normalized Fluent parity, design approval, or native OS/AT verification."
