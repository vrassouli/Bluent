name: Watch Bluent 2.0.0 publication

on:
  push:
    branches:
      - Dev
    paths:
      - .github/workflows/watch-release-2.0.0.yml
  workflow_run:
    workflows:
      - Release packages
    types:
      - completed

permissions:
  contents: write
  actions: read

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Determine release result
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            if [[ "$WORKFLOW_RUN_EVENT" != "workflow_dispatch" || "$WORKFLOW_RUN_HEAD_BRANCH" != "v2.0.0" ]]; then
              echo "relevant=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "status=completed" >> "$GITHUB_OUTPUT"
            echo "conclusion=$WORKFLOW_RUN_CONCLUSION" >> "$GITHUB_OUTPUT"
            echo "url=$WORKFLOW_RUN_URL" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          run_json="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow publish.yml \
            --event workflow_dispatch \
            --limit 20 \
            --json headBranch,status,conclusion,createdAt,url \
            --jq '[.[] | select(.headBranch == "v2.0.0")] | sort_by(.createdAt) | last // {}')"

          if [[ -z "$run_json" || "$run_json" == "{}" ]]; then
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "status=not-found" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          status="$(jq -r '.status // ""' <<<"$run_json")"
          conclusion="$(jq -r '.conclusion // ""' <<<"$run_json")"
          url="$(jq -r '.url // ""' <<<"$run_json")"
          echo "relevant=true" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Record current release status
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_STATUS: ${{ steps.release.outputs.status }}
          RELEASE_CONCLUSION: ${{ steps.release.outputs.conclusion }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
        run: |
          set -euo pipefail
          status_content="status=$RELEASE_STATUS
conclusion=$RELEASE_CONCLUSION
url=$RELEASE_URL
"
          encoded="$(printf '%s' "$status_content" | base64 -w0)"
          existing_sha="$(gh api "/repos/$GITHUB_REPOSITORY/contents/.release-2.0.0-status?ref=Dev" --jq .sha 2>/dev/null || true)"
          if [[ -n "$existing_sha" ]]; then
            gh api --method PUT \
              "/repos/$GITHUB_REPOSITORY/contents/.release-2.0.0-status" \
              -f message='chore: update 2.0.0 release status' \
              -f content="$encoded" \
              -f sha="$existing_sha" \
              -f branch=Dev >/dev/null
          else
            gh api --method PUT \
              "/repos/$GITHUB_REPOSITORY/contents/.release-2.0.0-status" \
              -f message='chore: record 2.0.0 release status' \
              -f content="$encoded" \
              -f branch=Dev >/dev/null
          fi

      - name: Fail if completed release failed
        if: steps.release.outputs.relevant == 'true' && steps.release.outputs.conclusion != '' && steps.release.outputs.conclusion != 'success'
        shell: bash
        run: |
          echo "Bluent 2.0.0 publication completed with conclusion: ${{ steps.release.outputs.conclusion }}" >&2
          exit 1

      - name: Clean up bootstrap workflows after successful release
        if: steps.release.outputs.relevant == 'true' && steps.release.outputs.conclusion == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for path in \
            .github/workflows/bootstrap-release-2.0.0.yml \
            .github/workflows/watch-release-2.0.0.yml \
            .release-2.0.0-status; do
            sha="$(gh api "/repos/$GITHUB_REPOSITORY/contents/$path?ref=Dev" --jq .sha 2>/dev/null || true)"
            if [[ -n "$sha" ]]; then
              gh api --method DELETE \
                "/repos/$GITHUB_REPOSITORY/contents/$path" \
                -f message='chore: remove 2.0.0 release bootstrap artifacts' \
                -f sha="$sha" \
                -f branch=Dev >/dev/null
            fi
          done
