name: Bootstrap Bluent 2.0.0 publication

on:
  push:
    branches:
      - Dev
    paths:
      - .github/workflows/bootstrap-release-2.0.0.yml

permissions:
  contents: write
  actions: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create validated annotated release tag
        shell: bash
        env:
          RELEASE_COMMIT: 5e134914aab0072471fb783990fc56bda66e5777
          RELEASE_TAG: v2.0.0
        run: |
          set -euo pipefail
          git fetch --force --tags origin

          if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            existing_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [[ "$existing_commit" != "$RELEASE_COMMIT" ]]; then
              echo "$RELEASE_TAG already exists at $existing_commit, expected $RELEASE_COMMIT" >&2
              exit 1
            fi
            echo "$RELEASE_TAG already points to the validated release commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" "$RELEASE_COMMIT" -m "Bluent 2.0.0"
            git push origin "$RELEASE_TAG"
          fi

      - name: Dispatch protected release workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run publish.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref v2.0.0 \
            -f version=2.0.0 \
            -f publish=true
