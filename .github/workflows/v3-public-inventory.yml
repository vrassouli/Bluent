name: Bluent v3 Public Component Census
on:
  pull_request:
    branches: [bluent-v3]
    paths:
      - ".github/workflows/v3-public-inventory.yml"
      - "scripts/quality/audit_v3_public_inventory.py"
      - "scripts/quality/test_v3_public_inventory.py"
      - "docs/components/inventory.md"
      - "docs/v3/inventory/**"
      - "src/Bluent.UI/Components/**"
      - "src/Bluent.UI.Charts/Components/**"
      - "src/Bluent.UI.Diagrams/Components/**"
      - "src/Bluent.UI.Utilities/**"
  workflow_dispatch:

jobs:
  source-census:
    name: Source and family snapshot
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Public source census drift
        run: python3 scripts/quality/audit_v3_public_inventory.py --check
      - name: Classification and parser tests
        run: python3 -m unittest discover -s scripts/quality -p 'test_v3_public_inventory.py' -v
      - name: Evidence disclaimer
        run: echo "Source candidate and family snapshot only; no API/runtime/visual signoff."

