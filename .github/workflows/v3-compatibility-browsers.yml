name: Bluent v3 Real Compatibility Browsers

# #425: independent Chrome/Edge x InteractiveServer/WebAssembly baseline.
# Every PR to isolated bluent-v3, including docs-only changes.
on:
  workflow_dispatch:
  pull_request:
    branches: [bluent-v3]

permissions:
  contents: read

concurrency:
  group: v3-compat-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: ${{ matrix.browser }} / ${{ matrix.render_mode }}
    runs-on: windows-latest
    timeout-minutes: 26
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        browser: [Chrome, Edge]
        render_mode: [Server, WASM]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify PNG integrity policy with positive and negative image fixtures
        run: node --test scripts/quality/test_v3_png_evidence.mjs
      - name: Restore solution
        run: dotnet restore Bluent.sln --nologo
      - name: Select real installed browser
        shell: pwsh
        run: |
          if ("${{ matrix.browser }}" -eq "Chrome") {
            $candidates = @('C:\Program Files\Google\Chrome\Application\chrome.exe','C:\Program Files (x86)\Google\Chrome\Application\chrome.exe')
          } else {
            $candidates = @('C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe','C:\Program Files\Microsoft\Edge\Application\msedge.exe')
          }
          $browser = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $browser) { throw "Requested browser not installed: ${{ matrix.browser }}" }
          "CHROME_PATH=$browser" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Exercise real Blazor interactions and capture screenshot evidence
        shell: pwsh
        env:
          BLUENT_V3_RENDER_MODE: ${{ matrix.render_mode }}
          BLUENT_V3_BROWSER_NAME: ${{ matrix.browser }}
          BLUENT_V3_EVIDENCE_DIR: ${{ runner.temp }}/v3-compat-evidence
        run: node scripts/quality/probe_v3_compatibility_runtime.mjs
      - name: Preserve JSON and viewport screenshots regardless of success
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-compat-${{ matrix.browser }}-${{ matrix.render_mode }}-${{ github.sha }}
          path: ${{ runner.temp }}/v3-compat-evidence
          if-no-files-found: error
          retention-days: 7
