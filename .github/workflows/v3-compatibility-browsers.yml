name: Bluent v3 Real Compatibility Browsers

# #425: independent Chrome/Edge x InteractiveServer/WebAssembly baseline.
# Every PR to isolated bluent-v3, including docs-only changes.
on:
  workflow_dispatch:
  pull_request:
    branches: [bluent-v3]

permissions:
  contents: read

concurrency:
  group: v3-compat-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: ${{ matrix.browser }} / ${{ matrix.render_mode }}
    runs-on: windows-latest
    timeout-minutes: 26
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        browser: [Chrome, Edge]
        render_mode: [Server, WASM]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify PNG integrity policy with positive and negative image fixtures
        run: node --test scripts/quality/test_v3_png_evidence.mjs
      - name: Restore solution
        run: dotnet restore Bluent.sln --nologo
      - name: Select real installed browser
        shell: pwsh
        run: |
          if ("${{ matrix.browser }}" -eq "Chrome") {
            $candidates = @('C:\Program Files\Google\Chrome\Application\chrome.exe','C:\Program Files (x86)\Google\Chrome\Application\chrome.exe')
          } else {
            $candidates = @('C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe','C:\Program Files\Microsoft\Edge\Application\msedge.exe')
          }
          $browser = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $browser) { throw "Requested browser not installed: ${{ matrix.browser }}" }
          "CHROME_PATH=$browser" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Exercise real Blazor interactions and capture screenshot evidence
        shell: pwsh
        env:
          BLUENT_V3_RENDER_MODE: ${{ matrix.render_mode }}
          BLUENT_V3_BROWSER_NAME: ${{ matrix.browser }}
          BLUENT_V3_EVIDENCE_DIR: ${{ runner.temp }}/v3-compat-evidence
        run: node scripts/quality/probe_v3_compatibility_runtime.mjs
      - name: Preserve JSON and viewport screenshots regardless of success
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-compat-${{ matrix.browser }}-${{ matrix.render_mode }}-${{ github.sha }}
          path: ${{ runner.temp }}/v3-compat-evidence
          if-no-files-found: error
          retention-days: 7


  label-info-runtime:
    name: Label Info / ${{ matrix.browser }} / ${{ matrix.culture }}
    runs-on: windows-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        browser: [Chrome, Edge]
        culture: [en-US, fa-IR]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Detect Label runtime probe in this checkout
        id: label
        shell: pwsh
        run: |
          $present = (Test-Path 'scripts/quality/probe_v3_label_runtime.mjs') -and (Test-Path 'src/Bluent.UI/Components/LabelComponent/Label.razor')
          "present=$($present.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Select real installed browser
        id: browser
        if: steps.label.outputs.present == 'true'
        shell: pwsh
        run: |
          if ("${{ matrix.browser }}" -eq "Chrome") {
            $candidates = @('C:\Program Files\Google\Chrome\Application\chrome.exe','C:\Program Files (x86)\Google\Chrome\Application\chrome.exe')
            $engine = 'chrome'
            $engineUpper = 'CHROME'
          } else {
            $candidates = @('C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe','C:\Program Files\Microsoft\Edge\Application\msedge.exe')
            $engine = 'edge'
            $engineUpper = 'EDGE'
          }
          $browser = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $browser) { throw "Requested browser not installed: ${{ matrix.browser }}" }
          $culture = '${{ matrix.culture }}'
          $cultureSuffix = if ($culture -eq 'fa-IR') { '-FA-IR' } else { '' }
          $evidence = "docs/v3/quality/evidence/BLUENT-LABEL-$engineUpper$cultureSuffix.json"
          "CHROME_PATH=$browser" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "engine=$engine" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "culture=$culture" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "evidence=$evidence" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Restore Bluent solution
        if: steps.label.outputs.present == 'true'
        run: dotnet restore Bluent.sln --nologo
      - name: Run live Label association, Info and keyboard probe
        if: steps.label.outputs.present == 'true'
        run: node scripts/quality/probe_v3_label_runtime.mjs ${{ steps.browser.outputs.engine }} ${{ steps.browser.outputs.culture }}
      - name: Preserve Label browser evidence
        if: always() && steps.label.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: v3-label-${{ matrix.browser }}-${{ matrix.culture }}-${{ github.sha }}
          path: ${{ steps.browser.outputs.evidence }}
          if-no-files-found: error
          retention-days: 7

  textfield-runtime:
    name: TextField / ${{ matrix.browser }} / ${{ matrix.render_mode }}
    runs-on: windows-latest
    timeout-minutes: 24
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        browser: [Chrome, Edge]
        render_mode: [InteractiveServer, WebAssembly]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build current Bluent UI JavaScript and CSS assets
        shell: pwsh
        run: |
          npm --prefix src/Bluent.UI.Scripts ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix src/Bluent.UI.Scripts run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix src/Bluent.UI ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix src/Bluent.UI run build:scss
          exit $LASTEXITCODE
      - name: Restore Bluent solution
        run: dotnet restore Bluent.sln --nologo
      - name: Build current WebAssembly and Server hosts
        shell: pwsh
        run: |
          dotnet build src/Bluent.UI.Demo/Bluent.UI.Demo.csproj --configuration Debug --no-restore -warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build src/Bluent.UI.Demo.SSR/Bluent.UI.Demo.SSR.csproj --configuration Debug --no-restore -warnaserror
          exit $LASTEXITCODE
      - name: Select installed browser
        shell: pwsh
        run: |
          if ("${{ matrix.browser }}" -eq "Chrome") {
            $candidates = @('C:/Program Files/Google/Chrome/Application/chrome.exe','C:/Program Files (x86)/Google/Chrome/Application/chrome.exe')
          } else {
            $candidates = @('C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe','C:/Program Files/Microsoft/Edge/Application/msedge.exe')
          }
          $browser = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $browser) { throw "Requested browser not installed: ${{ matrix.browser }}" }
          "CHROME_PATH=$browser" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BLUENT_BROWSER_LABEL=${{ matrix.browser }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Start the requested interactive TextField host
        id: host
        shell: pwsh
        env:
          BLUENT_MODE: ${{ matrix.render_mode }}
        run: |
          if ($env:BLUENT_MODE -eq 'InteractiveServer') {
            $project = 'src/Bluent.UI.Demo.SSR/Bluent.UI.Demo.SSR.csproj'
            $port = 5081
            $route = '/compatibility/text-fields-server'
          } else {
            $project = 'src/Bluent.UI.Demo/Bluent.UI.Demo.csproj'
            $port = 5080
            $route = '/components/text-fields'
          }
          $arguments = "run --project $project --no-build --configuration Debug --urls http://127.0.0.1:$port"
          $hostProcess = Start-Process -FilePath dotnet -ArgumentList $arguments -WorkingDirectory $env:GITHUB_WORKSPACE -WindowStyle Hidden -PassThru
          "BLUENT_HOST_PID=$($hostProcess.Id)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BLUENT_HOST_PORT=$port" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BLUENT_TEXTFIELD_ROUTE=$route" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BLUENT_TEXTFIELD_RENDER_MODE=$env:BLUENT_MODE" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $ready = $false
          for ($attempt = 0; $attempt -lt 90; $attempt++) {
            try {
              $response = Invoke-WebRequest -Uri "http://127.0.0.1:$port$route" -UseBasicParsing -TimeoutSec 3
              if ($response.StatusCode -eq 200) { $ready = $true; break }
            } catch {}
            Start-Sleep -Seconds 1
          }
          if (-not $ready) { throw "TextField host did not become ready: $project on port $port" }
      - name: Run real-browser TextField API and interaction matrix
        shell: pwsh
        run: node scripts/quality/probe_v3_textfield_demo.mjs "http://127.0.0.1:$env:BLUENT_HOST_PORT"
      - name: Stop only this job's host and disposable browser processes
        if: always()
        shell: pwsh
        run: |
          if ($env:BLUENT_HOST_PID) {
            & taskkill.exe /PID $env:BLUENT_HOST_PID /T /F 2>$null | Out-Null
          }
          $owned = @(Get-CimInstance Win32_Process | Where-Object {
            $_.Name -in @('chrome.exe','msedge.exe') -and
            $_.CommandLine -like '*bluent-v3-432-textfield-*'
          })
          foreach ($item in $owned) {
            Stop-Process -Id ([int]$item.ProcessId) -Force -ErrorAction SilentlyContinue
          }
          Start-Sleep -Milliseconds 250
          $remaining = @(Get-CimInstance Win32_Process | Where-Object {
            $_.Name -in @('chrome.exe','msedge.exe') -and
            $_.CommandLine -like '*bluent-v3-432-textfield-*'
          })
          if ($remaining.Count -gt 0) { throw "QA-owned browser processes remain: $($remaining.Count)" }
      - name: Preserve TextField JSON and viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-textfield-${{ matrix.browser }}-${{ matrix.render_mode }}-${{ github.sha }}
          path: |
            docs/v3/quality/evidence/BLUENT-TEXTFIELD-*.json
            docs/v3/quality/evidence/BLUENT-TEXTFIELD-*.png
          if-no-files-found: warn
          retention-days: 7
