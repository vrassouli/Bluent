name: Bluent v3 Real Browser Lab

# Draft issue #418 only; never runs on protected Dev or stable releases.
on:
  workflow_dispatch:
  pull_request:
    branches: [bluent-v3]
    paths:
      - ".github/workflows/v3-browser-lab.yml"
      - "scripts/quality/probe_v3_blazor_runtime.mjs"
      - "scripts/quality/probe_v3_focus_alpha_hosts_browser.mjs"
      - "scripts/quality/audit_v3_focus_alpha_hosts.py"
      - "scripts/quality/test_v3_focus_alpha_hosts.py"
      - "scripts/quality/v3_persian_font_evidence.mjs"
      - "scripts/quality/test_v3_persian_font_evidence.mjs"
      - "scripts/quality/probe_v3_forced_colors_runtime.mjs"
      - "docs/v3/tokens/issue-418-*"
      - "src/Bluent.UI.Demo.Pages/wwwroot/v3/issue-418.opt-in.preview.css"
      - "src/Bluent.UI/wwwroot/v3/danger-toggle.opt-in.preview.css"
      - "src/Bluent.UI.Demo.Pages/Pages/Scenarios/V3*"
      - "src/Bluent.UI.Demo.SSR/**"
      - "src/Bluent.UI/Components/ButtonComponent/**"
      - "src/Bluent.UI/Components/DialogComponent/**"
      - "src/Bluent.UI/Components/PopoverComponent/**"
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  blazor-interaction:
    name: ${{ matrix.browser }} / ${{ matrix.render_mode }}
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        browser: [Chrome, Edge]
        render_mode: [WASM, Server]
    steps:
      - name: Checkout isolated v3 revision
        uses: actions/checkout@v4
      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install Node 24 for native WebSocket CDP
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Restore only (no NuGet publishing)
        run: dotnet restore Bluent.sln --nologo
      - name: Verify the generated demo CSS is synced
        run: python scripts/quality/sync_v3_token_demo_asset.py --check
      - name: Verify Persian font telemetry evidence policy and negative controls
        run: node --test scripts/quality/test_v3_persian_font_evidence.mjs
      - name: Build real Blazor WASM host in Debug
        run: dotnet build src/Bluent.UI.Demo/Bluent.UI.Demo.csproj --configuration Debug --no-restore --nologo -warnaserror
      - name: Select installed browser and interactive render mode
        shell: pwsh
        run: |
          if ("${{ matrix.browser }}" -eq "Chrome") {
            $candidates = @(
              'C:\Program Files\Google\Chrome\Application\chrome.exe',
              'C:\Program Files (x86)\Google\Chrome\Application\chrome.exe'
            )
          } else {
            $candidates = @(
              'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe',
              'C:\Program Files\Microsoft\Edge\Application\msedge.exe'
            )
          }
          $selected = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $selected) { throw "Requested browser is not installed: ${{ matrix.browser }}" }
          "CHROME_PATH=$selected" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if ("${{ matrix.render_mode }}" -eq "Server") {
            "BLUENT_V3_LAB_MODE=server" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          Write-Host "Browser: $selected; mode: ${{ matrix.render_mode }}"
      - name: Audit actual transparent Focus host CSS in installed browser
        if: matrix.render_mode == 'WASM'
        shell: pwsh
        run: |
          python -m unittest discover -s scripts/quality -p test_v3_focus_alpha_hosts.py -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/quality/probe_v3_focus_alpha_hosts_browser.mjs
          exit $LASTEXITCODE
      - name: Exercise real opt-in controls with CDP
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "bluent-v3-real-browser.log"
          node scripts/quality/probe_v3_blazor_runtime.mjs *> $log
          $exitCode = $LASTEXITCODE
          Get-Content $log -Tail 110
          exit $exitCode
      - name: Verify forced colors independently in a fresh Blazor browser
        if: matrix.render_mode == 'WASM'
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "bluent-v3-forced-colors.log"
          node scripts/quality/probe_v3_forced_colors_runtime.mjs *> $log
          $exitCode = $LASTEXITCODE
          Get-Content $log -Tail 100
          exit $exitCode
      - name: Save browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v3-browser-${{ matrix.browser }}-${{ matrix.render_mode }}-failure
          path: |
            ${{ runner.temp }}/bluent-v3-real-browser.log
            ${{ runner.temp }}/bluent-v3-forced-colors.log
          if-no-files-found: ignore
          retention-days: 5
