name: v3 Component Lab Pilot

on:
  push:
    branches:
      - v3/issue-421-component-lab
    paths:
      - ".github/workflows/v3-component-lab.yml"
      - "scripts/quality/check_v3_component_lab.py"
      - "scripts/quality/generate_v3_component_lab_queue.py"
      - "scripts/quality/generate_v3_component_lab_ui_queue.py"
      - "docs/v3/inventory/public-component-sources.json"
      - "docs/v3/quality/COMPONENT-LAB-FAMILY-QUEUE.json"
      - "scripts/quality/probe_v3_component_lab.mjs"
      - "scripts/quality/run_v3_component_lab.ps1"
      - "src/Bluent.UI.Demo*/**"
      - "src/Bluent.UI/**"
      - "docs/v3/quality/COMPONENT-LAB-COVERAGE.json"
  pull_request:
    branches:
      - bluent-v3
    paths:
      - ".github/workflows/v3-component-lab.yml"
      - "scripts/quality/check_v3_component_lab.py"
      - "scripts/quality/generate_v3_component_lab_queue.py"
      - "scripts/quality/generate_v3_component_lab_ui_queue.py"
      - "docs/v3/inventory/public-component-sources.json"
      - "docs/v3/quality/COMPONENT-LAB-FAMILY-QUEUE.json"
      - "scripts/quality/probe_v3_component_lab.mjs"
      - "scripts/quality/run_v3_component_lab.ps1"
      - "src/Bluent.UI.Demo*/**"
      - "src/Bluent.UI/**"
      - "docs/v3/quality/COMPONENT-LAB-COVERAGE.json"

jobs:
  browser-lab-pilot:
    name: Real Component Lab / ${{ matrix.browser }} / ${{ matrix.mode }}
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [Chrome, Edge]
        mode: [WebAssembly, Server]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore current application and source API
        run: dotnet restore Bluent.sln --verbosity quiet
      - name: Validate honest source and coverage mapping
        run: python scripts/quality/check_v3_component_lab.py
      - name: Run owned real ${{ matrix.browser }} / ${{ matrix.mode }} scenario
        shell: pwsh
        run: |
          if ('${{ matrix.browser }}' -eq 'Edge') {
            $env:CHROME_PATH = 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
          }
          ./scripts/quality/run_v3_component_lab.ps1 -Mode '${{ matrix.mode }}'
