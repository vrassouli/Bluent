name: Bluent v3 Documentation Contract

# Separate v3 process: never release or update stable 2.x.
on:
  workflow_dispatch:
  pull_request:
    branches: [bluent-v3]
    paths:
      - ".github/workflows/v3-docs-contract.yml"
      - "docs/components/inventory.md"
      - "docs/components/button.md"
      - "docs/v3/components/label.md"
      - "docs/v3/design/MIGRATION-IMPACT-LEDGER.md"
      - "docs/v3/inventory/public-component-contracts.json"
      - ".agents/skills/bluent-v3-label/**"
      - "docs/v3/skills/README.md"
      - "src/Bluent.UI/Components/LabelComponent/**"
      - "src/Bluent.UI/Styles/Components/_label.scss"
      - "src/Bluent.UI/Styles/Components/components.css"
      - "src/Bluent.UI/wwwroot/bluent.ui.components.min.css"
      - "src/Bluent.UI.Demo.Pages/Pages/Components/Labels.razor"
      - "scripts/quality/check_v3_label_contract.py"
      - "scripts/quality/test_v3_label_contract.py"
      - "src/Bluent.UI/Components/TextFieldComponent/**"
      - "src/Bluent.UI/Components/BluentFieldComponentBase.cs"
      - "src/Bluent.UI/Components/BluentInputComponentBase.cs"
      - "docs/v3/design/TEXTFIELD-DESIGN-AND-API-CONTRACT.md"
      - "scripts/quality/check_v3_textfield_contract.py"
      - "scripts/quality/test_v3_textfield_contract.py"
      - "src/Bluent.UI/Components/ButtonComponent/Button.razor"
      - "src/Bluent.UI/Components/ButtonComponent/Button.razor.cs"
      - "src/Bluent.UI/Components/MenuListComponent/MenuList.razor"
      - "src/Bluent.UI/Components/MenuListComponent/MenuList.razor.cs"
      - "src/Bluent.UI/Components/MenuListComponent/MenuItem.razor"
      - "src/Bluent.UI/Components/MenuListComponent/MenuItem.razor.cs"
      - "src/Bluent.UI/Components/PopoverComponent/Popover.razor.cs"
      - "src/Bluent.UI/Components/PopoverComponent/PopoverContainerBase.cs"
      - "src/Bluent.UI/Interops/PopoverInterop.cs"
      - "src/Bluent.UI/Services/PopoverService.cs"
      - "src/Bluent.UI.Scripts/src/Popover/Popover.ts"
      - "src/Bluent.UI/Components/BluentUiComponentBase.cs"
      - "src/Bluent.UI.Demo.Pages/Pages/Components/Buttons.razor"
      - "scripts/quality/probe_v3_button_focus_runtime.mjs"
      - "src/Bluent.UI.Demo.Interactive.Client/Shared/CompatibilityProbe.razor"
      - "scripts/quality/probe_v3_button_toggle_interactive_server.mjs"
      - "src/Bluent.Core/BluentComponentBase.cs"
      - "docs/v3/**"
      - "scripts/quality/check_v3_docs_contract.py"
      - "scripts/quality/test_v3_docs_contract.py"

permissions:
  contents: read

jobs:
  v3-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout v3 branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate v3 docs and actual inventory
        run: python scripts/quality/check_v3_docs_contract.py
      - name: Validate Label semantics, token fallbacks, resources and demo
        run: |
          python scripts/quality/check_v3_label_contract.py
          python -m unittest discover -s scripts/quality -p 'test_v3_label_contract.py' -v
      - name: Validate TextField source/API and inherited contract
        run: |
          python scripts/quality/check_v3_textfield_contract.py
          python -m unittest discover -s scripts/quality -p 'test_v3_textfield_contract.py' -v
      - name: Validate stale summary negative cases
        run: python -m unittest discover -s scripts/quality -p "test_v3_docs_contract.py" -v
      - name: Validate all repository-local Markdown links
        run: python scripts/quality/check_markdown_links.py
      - name: Verify existing consumer skill coverage unchanged
        run: python scripts/quality/check_consumer_skill.py
