name: Bluent v3 Documentation Contract

# Separate v3 process: never release or update stable 2.x.
on:
  workflow_dispatch:
  pull_request:
    branches: [bluent-v3]
    paths:
      - ".github/workflows/v3-docs-contract.yml"
      - "docs/components/inventory.md"
      - "docs/components/button.md"
      - "src/Bluent.UI/Components/ButtonComponent/Button.razor"
      - "src/Bluent.UI/Components/ButtonComponent/Button.razor.cs"
      - "src/Bluent.UI/Components/BluentUiComponentBase.cs"
      - "src/Bluent.Core/BluentComponentBase.cs"
      - "docs/v3/**"
      - "scripts/quality/check_v3_docs_contract.py"
      - "scripts/quality/test_v3_docs_contract.py"

permissions:
  contents: read

jobs:
  v3-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout v3 branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate v3 docs and actual inventory
        run: python scripts/quality/check_v3_docs_contract.py
      - name: Validate stale summary negative cases
        run: python -m unittest discover -s scripts/quality -p "test_v3_docs_contract.py" -v
      - name: Validate all repository-local Markdown links
        run: python scripts/quality/check_markdown_links.py
      - name: Verify existing consumer skill coverage unchanged
        run: python scripts/quality/check_consumer_skill.py
