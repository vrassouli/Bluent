name: Deploy Blazor WebAssembly demo

on:
  workflow_dispatch:
  push:
    branches:
      - Dev
    paths:
      - '.github/workflows/static.yml'
      - 'src/Bluent.Core/**'
      - 'src/Bluent.UI/**'
      - 'src/Bluent.UI.Charts/**'
      - 'src/Bluent.UI.Diagrams/**'
      - 'src/Bluent.UI.Utilities/**'
      - 'src/Bluent.UI.Demo/**'
      - 'src/Bluent.UI.Demo.Pages/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Bluent.sln

      - name: Publish WebAssembly demo
        run: dotnet publish src/Bluent.UI.Demo/Bluent.UI.Demo.csproj --configuration Release --no-restore --output out

      - name: Add single-page application fallback
        run: cp out/wwwroot/index.html out/wwwroot/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/wwwroot

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
